<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dooka</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0D1117;
    color: #F8F8F4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 360px;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 8px;
  }
  p {
    color: #C7CCD1;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  a.button {
    display: inline-block;
    background: #178A45;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  a.secondary {
    display: block;
    color: #F7C948;
    text-decoration: none;
    font-size: 14px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🎟️ Invitation Dooka</h1>
    <p id="message">On t'a invité à rejoindre un groupe sur Dooka, l'appli entre potes pour suivre les gains PMU.</p>
    <a class="button" id="apk-link" href="https://github.com/TeamDooka/dooka/releases/latest/download/dooka.apk">Installer Dooka (Android)</a>
    <a class="secondary" id="open-app-link" href="#">Déjà installée ? Ouvrir l'appli</a>
  </div>
  <script>
    // Le lien d'invitation d'origine est de la forme
    // https://link.dooka.fr/join-group/<code> : si Android l'a ouvert ici
    // plutôt que directement dans l'app, c'est que l'App Link n'est pas
    // (encore) vérifié sur cet appareil — on tente quand même le lien de
    // schéma personnalisé dooka:// en dernier recours.
    var match = window.location.pathname.match(/join-group\/([A-Za-z0-9]+)/);
    if (match) {
      var code = match[1];
      var appUrl = 'dooka://join-group/' + code;
      document.getElementById('open-app-link').href = appUrl;
      document.getElementById('message').textContent =
        "On t'a invité à rejoindre un groupe sur Dooka. Si l'app est déjà installée, appuie sur \"Ouvrir l'appli\" ci-dessous. Sinon, installe-la d'abord.";
    }
  </script>
</body>
</html>
