<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demande d’ami — Dooka</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0D1117;
    color: #F8F8F4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 360px;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 8px;
  }
  p {
    color: #C7CCD1;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  a.button {
    display: inline-block;
    background: #178A45;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  a.secondary {
    display: block;
    color: #F7C948;
    text-decoration: none;
    font-size: 14px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>👋 Demande d’ami</h1>
    <p id="message">
      Quelqu’un veut t’ajouter en ami sur Dooka. Ouvre l’application, puis
      <strong>Mon profil → Amis</strong> pour accepter ou refuser.
    </p>
    <a class="button" id="apk-link" href="https://github.com/TeamDooka/dooka/releases/latest/download/dooka.apk">Installer Dooka (Android)</a>
    <a class="secondary" id="open-app-link" href="dooka://amis">Déjà installée ? Ouvrir l’appli</a>
  </div>
  <!--
    Cette page ne devrait presque jamais s’afficher : link.dooka.fr déclare
    /amis* dans apple-app-site-association et dans les intentFilters de
    l’app, donc le lien s’ouvre normalement dans Dooka.

    Elle sert les deux cas où ça ne se produit pas : l’app n’est pas
    installée, ou l’association n’est pas encore vérifiée sur l’appareil.
    Le second cas n’est pas rare — iOS met le fichier en cache, et une app
    déjà installée ne le relit qu’à sa mise à jour. Pendant quelques
    semaines après la sortie, beaucoup de monde passera donc ici.

    D’où le lien dooka:// en second recours : le schéma personnalisé ne
    dépend d’aucune vérification de domaine.
  -->
</body>
</html>
